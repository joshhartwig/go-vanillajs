<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelingIt - Movies</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" type="module" defer></script>
</head>
<body>
  <header>
    <h1><img src="images/logo.png" alt="ReelingIt Logo" height="35" alt="ReelingIt logo"></h1>
    <nav>
      <ul>
        <li><a class="nav-link" href="/">Movies</a></li>
        <li><a class="nav-link" href="/account/favorites">Favorites</a></li>
        <li><a class="nav-link" href="/account/watchlist">Watchlist</a></li>
        <li><a class="nav-link" href="/account">My Account</a></li>
      </ul>
    </nav>
    <div>
      <form onsubmit="app.search(event)">
        <input type="search" placeholder="Search Movies">
      </form>
    </div>
  </header>
  <main>
    <animated-loading data-elements="5" data-width="300px" data-height="200px"></animated-loading>
  </main>

    <template id="template-home">
      <section class="vertical-scroll" id="top-10">
        <h2>This weeks top movies</h2>
        <ul id="top-movies-list"></ul>
      </section>
      <section class="vertical-scroll" id="random">
        <h2>Feeling adventurous?</h2>
        <ul id="random-movies-list"></ul>
      </section>
    </template>

  
  <footer>
    <p>&copy; 2024 ReelingIt. All rights reserved.</p>
  </footer>
</body>
</html>
